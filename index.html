<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var html = document.documentElement;
          // Default to dark if nothing is saved
          if (savedTheme === 'light') {
            html.setAttribute('data-theme', 'light');
            html.classList.add('light');
          } else {
            html.setAttribute('data-theme', 'dark');
            html.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      name="description"
      content="MoneyGYAN — AMFI-Registered Mutual Fund Distributor (ARN-144200). Transparent, paperless, fund-neutral wealth platform for investors and distribution partners."
    />
    <title>MoneyGYAN — Mutual Funds &amp; Wealth Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
